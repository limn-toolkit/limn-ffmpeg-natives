# Publishes the FFmpeg payload to Maven Central, off a tag, and drafts the GitHub release.
#
# The version comes from the tag and from nowhere else: build.gradle.kts reads -PlimnNativesVersion
# and otherwise says -SNAPSHOT, so `v7.1.5.0` is what makes 7.1.5.0 exist. The tag itself is made
# by the tag-releases workflow from versions.properties; nobody types it.
#
# Six native builds happen in here, on five machines, and the binaries exist for the length of the
# run: they go into the jars, are REHEARSED as a consumer would receive them, are uploaded, and are
# gone. Neither half of a release publishes itself: the upload STOPS at the Portal as a staged
# deployment somebody presses Publish on, and the GitHub release is created as a DRAFT.
#
# Secrets (repository settings → Secrets and variables → Actions), the same four as limn-toolkit:
#   MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD   the Portal USER TOKEN, not the login
#   SIGNING_KEY                                       `gpg --armor --export-secret-keys <id>`
#   SIGNING_PASSWORD                                  that key's passphrase

name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, without the leading v. Blank takes versions.properties."
        required: false
        type: string
      force:
        description: "Upload again even though this version was already uploaded once"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve the version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            if [ -z "$VERSION" ]; then
              VERSION="$(sed -n 's/^limn-ffmpeg-natives[[:space:]]*=[[:space:]]*//p' versions.properties | tr -d '[:space:]')"
              echo "version left blank; versions.properties says $VERSION"
            fi
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)[0-9]+)?$'; then
            echo "::error::'$VERSION' is not a release version (expected <ffmpeg>.<n>, e.g. 7.1.5.0)"
            exit 1
          fi
          PIN="$(sed -n 's/^FFMPEG_VERSION="\(.*\)"$/\1/p' scripts/build-ffmpeg.sh)"
          case "$VERSION" in
            "$PIN".*) ;;
            *) echo "::error::$VERSION does not name the FFmpeg the script pins ($PIN)"; exit 1 ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "publishing limn-ffmpeg-natives $VERSION (FFmpeg $PIN)"

      # Every published version is a tag, made true rather than customary.
      - name: Verify the tag
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if ! git rev-parse -q --verify "refs/tags/$TAG^{commit}" >/dev/null; then
            echo "::error::$TAG does not exist. A push to main with the bumped versions.properties creates it."
            exit 1
          fi
          TAGGED="$(git rev-parse "$TAG^{commit}")"
          if [ "$TAGGED" != "$GITHUB_SHA" ]; then
            echo "::error::$TAG points at $TAGGED, not at the commit being built ($GITHUB_SHA)"
            exit 1
          fi
          echo "$TAG is $TAGGED"

      # One upload per version, enforced rather than assumed; `force` is for deliberately
      # replacing an upload whose deployment was dropped on the Portal.
      - name: Refuse a second upload of the same version
        if: ${{ !inputs.force }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          PRIOR="$(gh run list --workflow publish.yml --branch "$TAG" --status success \
                     --limit 20 --json url --jq '.[0].url // empty')"
          if [ -n "$PRIOR" ]; then
            echo "::error::$TAG has already been uploaded, by $PRIOR. Nothing was sent this time."
            exit 1
          fi
          echo "no successful publish run for $TAG yet"

  # The six slices, built here and nowhere else.
  natives:
    needs: verify
    uses: ./.github/workflows/natives.yml

  publish:
    needs: [verify, natives]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      version: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      # The six slices the natives job built, merged into the one tree the build packages from.
      - name: Fetch the native payload
        uses: actions/download-artifact@v8
        with:
          pattern: ffmpeg-native-*
          merge-multiple: true
          path: native/dist/player

      - name: Check the payload is complete
        run: |
          echo "slices present:"
          ls native/dist/player/limn/video/ffmpeg/native

      # The rehearsal a first release should never have skipped: publish to a file repository,
      # resolve from it as a target-17 consumer, and check every jar holds what the loader needs.
      # It runs BEFORE the upload because Central keeps what it accepts.
      - name: Rehearse the consumer
        run: bash scripts/rehearse-consumer.sh ${{ needs.verify.outputs.version }}

      - name: Publish to Maven Central
        run: >-
          ./gradlew publishToMavenCentral
          -PlimnNativesVersion=${{ needs.verify.outputs.version }}
          -PlimnFfmpegProfile=player
          --no-daemon
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}

  # The only job that can write to the repository, and deliberately the smallest: no checkout,
  # no build, no secrets.
  draft-release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Draft the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "a release already exists for $TAG; leaving it untouched"
            exit 0
          fi
          gh release create "$TAG" \
            --draft \
            --title "limn-ffmpeg-natives $VERSION" \
            --generate-notes \
            --notes "$(cat <<NOTES
          Published to Maven Central as \`io.github.limn-toolkit:limn-ffmpeg-natives:$VERSION\`
          — FFmpeg ${VERSION%.*}, versioned with FFmpeg rather than with the toolkit.

          **Who reads this artifact.** The toolkit's \`limn-video-ffmpeg\` module, from the
          limn-toolkit release that adopts it onward (its own POM names the exact version it
          was tested with, and brings the main jar — the JNI shim for every platform — with
          it). Check that release's notes before adding anything below: an older
          \`limn-video-ffmpeg\` carries its own shim and its own classifiers and does not look
          here.

          **What an application adds** is the FFmpeg libraries for the machines it ships to,
          one \`natives-<os>-<arch>\` classifier per target (~2 MB each):
          \`natives-linux-x86_64\`, \`natives-linux-aarch64\`, \`natives-macos-x86_64\`,
          \`natives-macos-aarch64\`, \`natives-windows-x86_64\`, \`natives-windows-aarch64\`.

          Gradle, one target (pick yours) — or list several for a bundle that ships to several:

          \`\`\`kotlin
          dependencies {
              runtimeOnly("io.github.limn-toolkit:limn-ffmpeg-natives:$VERSION:natives-linux-x86_64")
          }
          \`\`\`

          Gradle, all six at once — one line, via the toolkit's aggregator POM (which names
          this payload's exact version, from the toolkit release that adopts it):

          \`\`\`kotlin
          dependencies {
              runtimeOnly("io.github.limn-toolkit:limn-video-ffmpeg-natives-all:<toolkit version>")
          }
          \`\`\`

          Maven, one target:

          \`\`\`xml
          <dependency>
            <groupId>io.github.limn-toolkit</groupId>
            <artifactId>limn-ffmpeg-natives</artifactId>
            <version>$VERSION</version>
            <classifier>natives-linux-x86_64</classifier>
            <scope>runtime</scope>
          </dependency>
          \`\`\`

          Maven, all six: the same aggregator, \`limn-video-ffmpeg-natives-all\` at the toolkit
          version, with \`<type>pom</type>\` and \`<scope>runtime</scope>\`.

          Leave the classifier out and the toolkit still runs; the decoder reports itself
          unavailable, naming the platform it looked for. FFmpeg here is LGPL-2.1-or-later,
          built shared, dynamically linked and replaceable file for file; its licence and notice
          travel in every jar. No encoder, no GPL component, no network protocol.

          ---
          NOTES
          )"
          echo "### Drafted $TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "1. The deployment on <https://central.sonatype.com/publishing/deployments> — inspect it, then **Publish** (or **Drop**)." >> "$GITHUB_STEP_SUMMARY"
          echo "2. The draft release on <https://github.com/$GH_REPO/releases> — edit the notes, then publish it." >> "$GITHUB_STEP_SUMMARY"
