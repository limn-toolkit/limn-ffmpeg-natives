# The version the NEXT release carries — the single place it is written.
#
# Two readers of one file: build.gradle.kts turns it into the default (-SNAPSHOT) version, and
# the tag-releases workflow turns it into the tag `v<version>` on every push to main, creating
# and publishing it if it does not exist yet. Releasing is: bump this (with the FFmpeg pin in
# scripts/build-ffmpeg.sh, if the pin moved), commit, push. Nobody types or pushes a tag.
#
# The scheme: the first three components ARE the FFmpeg version the script pins (the build
# refuses a mismatch), and the fourth is this repository's own — a shim change or a rebuild of
# the same FFmpeg spends it. So 7.1.5.0 is FFmpeg 7.1.5 as first packaged; 7.1.5.1 is the same
# FFmpeg with a newer shim; 7.1.6.0 is the next FFmpeg.
# 7.1.5.1: the same FFmpeg and shim, with a module name in every jar's manifest.
limn-ffmpeg-natives=7.1.5.1
